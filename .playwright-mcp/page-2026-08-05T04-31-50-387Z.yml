            - code [ref=e141]: "algebra/ ├── src/ │ ├── lib.rs # Module exports │ ├── ring.rs # Ring module interface │ └── ring/ │ ├── ring_impl.rs # RingElement implementation │ ├── int_ring.rs # IntRing2k trait definition │ └── bit.rs # Single-bit type"
