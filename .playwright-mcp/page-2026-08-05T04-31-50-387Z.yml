              - strong [ref=e131]: "Trait Requirements:"
            - code [ref=e134]: "pub trait IntRing2k: WrappingAdd + WrappingSub + WrappingMul + WrappingNeg + BitXor + BitAnd + BitOr + Shl<usize> + Shr<usize> + Zero + One + Copy + Send + Sync + 'static { const K: usize; // Number of bits const BYTES: usize; // Storage size in bytes fn from_reader<R: Read>(reader: R) -> io::Result<Self>; fn write<W: Write>(&self, writer: W) -> io::Result<()>; fn bits(&self) -> usize; fn cast_to_biguint(&self) -> BigUint; fn cast_from_biguint(biguint: &BigUint) -> Self; }"
