              - text: The
              - code [ref=e145]: RingElement
              - text: "type leverages Rust’s type system for zero-copy serialization:"
            - code [ref=e148]: "// On little-endian platforms, this is a simple pointer cast #[inline] pub fn slice_as_bytes(slice: &[Self]) -> &[u8] { unsafe { std::slice::from_raw_parts( slice.as_ptr() as *const u8, std::mem::size_of_val(slice), ) } }"
            - heading "Wrapping Arithmetic" [level=4] [ref=e149]
            - paragraph [ref=e150]: "All operations explicitly use wrapping arithmetic to match the mathematical semantics of Z_{2^k} rings, avoiding undefined behavior from overflow."
            - heading "Usage Examples" [level=3] [ref=e151]
            - code [ref=e154]: "use algebra::ring::{ring_impl::RingElement, int_ring::IntRing2k}; // Create ring elements let a = RingElement(42u64); let b = RingElement(100u64); // Wrapping arithmetic let c = a + b; // Automatic wrapping at 2^64 // Bit manipulation let bit_3 = a.get_bit(3); // Zero-copy network transmission let data: Vec<RingElement<u64>> = vec![a, b, c]; let bytes = RingElement::slice_as_bytes(&data); socket.send(bytes)?;"
