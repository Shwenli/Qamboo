[workspace]
members = [
    "protocols",
    "random",
    "algebra",
    "net",
    "communication",
    "operator",
    "primitives",
    "table",
    "experiments",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Anonymous"]
homepage = "Anonymous"
repository = "Anonymous"
license = "MIT OR Apache-2.0"
publish = false
readme = "./README.md"

[workspace.dependencies]
ark-ec = { version = "^0.5.0", default-features = false }
ark-ff = "^0.5.0"
ark-serialize = { version = "^0.5.0", features = ["derive", "std"] }
ark-std = { version = "^0.5.0", features = ["std"] }
bincode = "1.3.3"
byteorder = "1.5.0"
bytes = "1.5.0"
clap = { version = "4.4.8", features = ["derive"] }
color-eyre = "0.6.3"
criterion = { version = "0.5", features = ["async_tokio"] }
eyre = "0.6"
hex-literal = "0.4.1"
intmap = "3.1"
itertools = "0.14.0"
num-bigint = { version = "0.4.5" }
num-traits = { version = "0.2.18", default-features = false }
paste = "1.0.15"
rand = "0.8.5"
rand_chacha = "0.3"
rayon = "1.11.0"
rcgen = "0.13"
rustls = "0.23.15"
serde = { version = "1.0.193", features = ["derive", "rc"] }
serde_json = "1.0"
serde_yaml = "0.9.27"
ruint = "1.17.0"
subtle = "2.6"
thiserror = "2"
toml = "0.8.13"
indexmap = "2.10"
tracing = { version = "0.1.40" }
tracing-subscriber = "0.3"
polars = "0.52.0"


# This profile can be used for CI in pull requests.
[profile.ci-dev]
opt-level = 1
inherits = "dev"
incremental = false
debug = true
overflow-checks = false
# [profile.ci-dev.build-override]
# opt-level = 3

#[profile.release]
#lto = "thin"
