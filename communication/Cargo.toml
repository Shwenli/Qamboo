[package]
name = "communication"
version = "0.1.0"
exclude = ["data"]
publish.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
rust-version.workspace = true

# 
[features]
default = ["fast_tcp"]
tcp = ["dep:crossbeam-channel", "dep:socket2"]
fast_tcp = ["dep:crossbeam-channel", "dep:socket2"]



[dependencies]
ark-serialize = { workspace = true }
byteorder.workspace = true
bytes = { workspace = true }
eyre.workspace = true
futures = { version = "0.3.30", optional = true }
intmap.workspace = true
itertools.workspace = true
parking_lot = "0.12.4"
quinn = { version = "0.11", optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { version = "1.34.0", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
], optional = true }
tokio-util = { version = "0.7.10", features = ["codec"], optional = true }
toml.workspace = true
tracing = { workspace = true }
crossbeam-channel = { version = "0.5.15", optional = true }
humantime-serde = "1.1.1"
socket2 = { version = "0.6.0", optional = true }
bincode = { version = "1.3", optional = true }
rand = { version = "0.8", optional = true }
net = { version = "0.4.0", path = "../net", default-features = true }
algebra = {version = "0.1.0", path = "../algebra"}




[dev-dependencies]
clap = { workspace = true }
color-eyre = { workspace = true }
rcgen = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
