[package]
name = "net"
version = "0.4.0"
exclude = ["data"]
publish.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
# 
[features]
default = ["tcp"]
tcp = ["dep:crossbeam-channel", "dep:socket2"]
#fast_tcp = ["dep:crossbeam-channel", "dep:socket2"]
#rdma = ["dep:crossbeam-channel", "dep:rdma", "dep:bincode", "dep:rand"]


[[example]]
name = "three_party_tcp"
required-features = ["tcp"]


[dependencies]
byteorder.workspace = true
bytes = { workspace = true }
eyre.workspace = true
futures = { version = "0.3.30", optional = true }
intmap.workspace = true
itertools.workspace = true
parking_lot = "0.12.4"
quinn = { version = "0.11", optional = true }
rustls = { workspace = true, optional = true }
serde = { workspace = true }
tokio = { version = "1.34.0", features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "macros",
], optional = true }
tokio-util = { version = "0.7.10", features = ["codec"], optional = true }
toml.workspace = true
tracing = { workspace = true }
crossbeam-channel = { version = "0.5.15", optional = true }
humantime-serde = "1.1.1"
socket2 = { version = "0.6.0", optional = true }
bincode = { version = "1.3", optional = true }
rand = { version = "0.8", optional = true }




[dev-dependencies]
clap = { workspace = true }
color-eyre = { workspace = true }
rcgen = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
